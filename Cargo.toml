[package]
name = "rusttracker"
version = "0.9.39"
edition = "2024"
authors = ["Soddentrough"]
default-run = "rusttracker"
description = "High-Performance WGPU Audio, Video & Tracker Visualizer"
license = "GPL-3.0-or-later"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rusttracker", dest = "/usr/bin/rusttracker", mode = "755" },
    { source = "rusttracker.desktop", dest = "/usr/share/applications/rusttracker.desktop", mode = "644" },
    { source = "com.soddentrough.rusttracker.metainfo.xml", dest = "/usr/share/metainfo/com.soddentrough.rusttracker.metainfo.xml", mode = "644" },
    { source = "assets/icons/hicolor/16x16/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/16x16/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/hicolor/24x24/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/24x24/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/hicolor/32x32/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/32x32/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/hicolor/48x48/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/48x48/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/hicolor/64x64/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/64x64/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/hicolor/128x128/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/128x128/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/hicolor/256x256/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/256x256/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/hicolor/512x512/apps/rusttracker.png", dest = "/usr/share/icons/hicolor/512x512/apps/rusttracker.png", mode = "644" },
    { source = "assets/icons/pixmaps/rusttracker.png", dest = "/usr/share/pixmaps/rusttracker.png", mode = "644" },
    { source = "assets/soundfont.sf2", dest = "/usr/share/rusttracker/assets/soundfont.sf2", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/rusttracker/LICENSE", mode = "644" },
    { source = "THIRD_PARTY_NOTICES.txt", dest = "/usr/share/licenses/rusttracker/THIRD_PARTY_NOTICES.txt", mode = "644" }
]
post_install_script = """
/usr/bin/gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
/usr/bin/update-desktop-database -q || true
/usr/bin/update-mime-database /usr/share/mime || true
"""
post_uninstall_script = """
/usr/bin/gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
/usr/bin/update-desktop-database -q || true
/usr/bin/update-mime-database /usr/share/mime || true
"""

[package.metadata.deb]
copyright = "2026, Soddentrough"
assets = [
    ["target/release/rusttracker", "usr/bin/", "755"],
    ["rusttracker.desktop", "usr/share/applications/", "644"],
    ["com.soddentrough.rusttracker.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icons/hicolor/16x16/apps/rusttracker.png", "usr/share/icons/hicolor/16x16/apps/rusttracker.png", "644"],
    ["assets/icons/hicolor/24x24/apps/rusttracker.png", "usr/share/icons/hicolor/24x24/apps/rusttracker.png", "644"],
    ["assets/icons/hicolor/32x32/apps/rusttracker.png", "usr/share/icons/hicolor/32x32/apps/rusttracker.png", "644"],
    ["assets/icons/hicolor/48x48/apps/rusttracker.png", "usr/share/icons/hicolor/48x48/apps/rusttracker.png", "644"],
    ["assets/icons/hicolor/64x64/apps/rusttracker.png", "usr/share/icons/hicolor/64x64/apps/rusttracker.png", "644"],
    ["assets/icons/hicolor/128x128/apps/rusttracker.png", "usr/share/icons/hicolor/128x128/apps/rusttracker.png", "644"],
    ["assets/icons/hicolor/256x256/apps/rusttracker.png", "usr/share/icons/hicolor/256x256/apps/rusttracker.png", "644"],
    ["assets/icons/hicolor/512x512/apps/rusttracker.png", "usr/share/icons/hicolor/512x512/apps/rusttracker.png", "644"],
    ["assets/icons/pixmaps/rusttracker.png", "usr/share/pixmaps/rusttracker.png", "644"],
    ["assets/soundfont.sf2", "usr/share/rusttracker/assets/", "644"],
    ["LICENSE", "usr/share/doc/rusttracker/", "644"],
    ["THIRD_PARTY_NOTICES.txt", "usr/share/doc/rusttracker/", "644"]
]
extended-description = "A high-performance, real-time audio visualizer, video player, and tracker module player."

[workspace]
members = [
    ".",
    "crates/rt-core",
    "crates/rt-decode",
    "crates/rt-audio",
    "crates/rt-render",
    "crates/rt-tui",
]
resolver = "3"

[dependencies]
rt-core = { path = "crates/rt-core" }
rt-decode = { path = "crates/rt-decode" }
rt-audio = { path = "crates/rt-audio" }
rt-render = { path = "crates/rt-render" }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.15"
directories = "6.0.0"
egui = "0.34.2"
egui-file-dialog = "0.13.0"
egui-winit = "0.34.2"
env_logger = "0.11.10"
gilrs = "0.11.0"
image = "0.25.10"
naga = { version = "29.0.3", features = ["wgsl-in"] }
pollster = "0.4.0"
ttf-parser = "0.25"
wgpu = "29.0.3"
winit = "0.30.13"

[target.'cfg(not(target_os = "android"))'.dependencies]
rt-tui = { path = "crates/rt-tui" }
crossterm = "0.29.0"
ratatui = "0.30.0"
rfd = "0.17.2"
keepawake = "0.6.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
winit = { version = "0.30.13", features = ["android-game-activity"] }
jni = "0.21.1"

[dev-dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
glam = "0.32.1"

[build-dependencies]
winres = "0.1.12"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell",
] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.4"

[lib]
name = "rusttracker"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rusttracker"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0

# Strip heavy debug symbols from external dependencies to keep target/debug/deps lightweight
[profile.dev.package."*"]
debug = 0

# Split debuginfo out of rlibs to minimize archive sizes
[profile.dev]
split-debuginfo = "unpacked"



