[package]
name = "rt-audio"
version = "0.9.39"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
rt-core = { path = "../rt-core" }
rt-decode = { path = "../rt-decode" }
anyhow = "1.0.102"
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
midly = "0.5.3"
realfft = "3.5"
rustysynth = "1.3.6"
symphonia = { version = "0.5.5", features = ["all"] }
ureq = "3.3.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

[target.'cfg(target_os = "android")'.dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["static", "codec", "format", "software-resampling", "software-scaling"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem"
] }
