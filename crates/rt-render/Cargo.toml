[package]
name = "rt-render"
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
rt-core = { path = "../rt-core" }
wgpu = "30.0.2"
winit = "0.30.13"
bytemuck = { version = "1.25.0", features = ["derive"] }
pollster = "0.4.0"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
egui-file-dialog = "0.16.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
glam = "0.32.1"
directories = "6.0.0"
ttf-parser = "0.25"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-game-activity"] }
