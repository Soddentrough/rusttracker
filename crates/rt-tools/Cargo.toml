[package]
name = "rt-tools"
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
naga = { version = "30.0.2", features = ["wgsl-in"] }
ttf-parser = "0.25"

[target.'cfg(not(target_os = "android"))'.dependencies]
ffmpeg-next = { version = "9.1.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
